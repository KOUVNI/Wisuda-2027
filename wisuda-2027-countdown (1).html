<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Wisuda 2027 — Hitung Mundur</title>
<meta name="description" content="Tinggal sedikit lagi, jangan menyerah dan bersabarlah. Hitung mundur menuju Wisuda 2027." />

<meta property="og:title" content="Wisuda 2027" />
<meta property="og:description" content="Tinggal sedikit lagi, jangan menyerah dan bersabarlah." />
<meta property="og:type" content="website" />

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%93%3C/text%3E%3C/svg%3E" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,450;0,9..144,600;1,9..144,450&family=Work+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
  :root {
    --ivory: #1C1A17;
    --ivory-deep: #262320;
    --ink: #E8E3D8;
    --ink-soft: #9C9689;
    --emerald: #8B9D8E;
    --emerald-deep: #B9C6BA;
    --gold: #A38F63;
    --gold-light: #8A7A56;
    --line: rgba(163, 143, 99, 0.18);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--ivory);
    color: var(--ink);
    font-family: 'Work Sans', -apple-system, sans-serif;
    min-height: 100%;
  }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow-x: hidden;
    position: relative;
    padding: 40px 20px;
  }

  .bg-wash {
    position: fixed;
    inset: 0;
    z-index: 0;
    background:
      radial-gradient(ellipse 60% 40% at 50% 0%, rgba(156, 138, 99, 0.09), transparent 60%),
      radial-gradient(ellipse 70% 50% at 50% 100%, rgba(75, 93, 80, 0.07), transparent 60%);
    pointer-events: none;
  }

  .sparkle {
    position: fixed;
    z-index: 0;
    border-radius: 50%;
    background: var(--gold-light);
    opacity: 0;
    pointer-events: none;
    animation: drift 14s ease-in-out infinite;
  }

  @keyframes drift {
    0%   { opacity: 0; transform: translateY(0) scale(0.6); }
    15%  { opacity: 0.55; }
    50%  { opacity: 0.35; transform: translateY(-40px) scale(1); }
    85%  { opacity: 0.15; }
    100% { opacity: 0; transform: translateY(-90px) scale(0.6); }
  }

  .stage {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 620px;
    text-align: center;
  }

  .laurel {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    margin-bottom: 28px;
    color: var(--gold);
  }
  .laurel svg { width: 34px; height: 34px; }
  .laurel .cap {
    color: var(--emerald);
    width: 30px;
    height: 30px;
  }

  .eyebrow {
    font-family: 'Work Sans', sans-serif;
    font-weight: 500;
    font-size: 13px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--gold);
    margin: 0 0 18px;
  }

  h1.title {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-style: normal;
    font-size: clamp(2.6rem, 9vw, 4.4rem);
    line-height: 1.05;
    letter-spacing: -0.01em;
    margin: 0 0 16px;
    color: var(--emerald-deep);
  }

  .subtitle {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-weight: 450;
    font-size: clamp(1.05rem, 3vw, 1.3rem);
    color: var(--ink-soft);
    max-width: 460px;
    margin: 0 auto 44px;
    line-height: 1.5;
  }

  .divider {
    width: 64px;
    height: 1px;
    background: var(--gold);
    margin: 0 auto 44px;
    opacity: 0.6;
  }

  .countdown {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: clamp(10px, 3vw, 22px);
    margin-bottom: 40px;
  }

  .unit {
    position: relative;
    background: var(--ivory-deep);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: clamp(16px, 4vw, 26px) 6px;
  }

  .unit::after {
    content: "";
    position: absolute;
    top: 8px; left: 8px; right: 8px; bottom: 8px;
    border: 1px solid rgba(156, 138, 99, 0.24);
    border-radius: 9px;
    pointer-events: none;
  }

  .num {
    display: block;
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    font-size: clamp(1.8rem, 6.5vw, 3rem);
    color: var(--emerald-deep);
    line-height: 1;
    transition: opacity 0.25s ease;
  }

  .num.tick { animation: tick 0.4s ease; }
  @keyframes tick {
    0%   { opacity: 0.25; transform: translateY(3px); }
    100% { opacity: 1; transform: translateY(0); }
  }

  .label {
    display: block;
    margin-top: 10px;
    font-size: clamp(10px, 2vw, 12px);
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-soft);
    font-weight: 500;
  }

  .target-date {
    font-size: 14px;
    color: var(--ink-soft);
    font-weight: 400;
    letter-spacing: 0.02em;
  }

  .target-date strong {
    color: var(--emerald);
    font-weight: 600;
  }

  .celebrate {
    display: none;
  }
  .celebrate.show {
    display: block;
  }
  .celebrate .cap-big {
    width: 56px;
    height: 56px;
    color: var(--emerald);
    margin: 0 auto 18px;
  }
  .celebrate p {
    font-family: 'Fraunces', serif;
    font-size: clamp(1.6rem, 5vw, 2.2rem);
    color: var(--emerald-deep);
    margin: 0 0 8px;
  }

  .sr-fallback {
    position: absolute;
    width: 1px; height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
  }

  noscript .fallback-visible {
    position: static;
    width: auto; height: auto;
    clip: auto;
    display: block;
    margin-top: 20px;
    color: var(--ink-soft);
    font-size: 15px;
  }

  @media (max-width: 420px) {
    .countdown { gap: 8px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .sparkle { animation: none; display: none; }
    .num.tick { animation: none; }
  }
</style>
</head>
<body>

<div class="bg-wash" aria-hidden="true"></div>
<div id="sparkles" aria-hidden="true"></div>

<main class="stage">
  <div class="laurel" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M12 21c-3-2-6-6-6-11 2 1 4 3 4 6 0-4-1-7-3-9 2 0 4 1 5 3 0-3-1-5-2-7 2 1 3 3 3 5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <svg class="cap" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M12 3 2 8l10 5 10-5-10-5Z" stroke-linejoin="round"/><path d="M6 10.5V16c0 1.5 2.7 3 6 3s6-1.5 6-3v-5.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M22 8v6" stroke-linecap="round"/></svg>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" style="transform: scaleX(-1);"><path d="M12 21c-3-2-6-6-6-11 2 1 4 3 4 6 0-4-1-7-3-9 2 0 4 1 5 3 0-3-1-5-2-7 2 1 3 3 3 5" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </div>

  <p class="eyebrow">Menuju Hari Bahagia</p>
  <h1 class="title">Wisuda 2027</h1>
  <p class="subtitle">Tinggal sedikit lagi, jangan menyerah dan bersabarlah.</p>
  <div class="divider" aria-hidden="true"></div>

  <div id="countdownBlock">
    <div class="countdown" role="timer" aria-live="off">
      <div class="unit">
        <span class="num" id="days">00</span>
        <span class="label">Hari</span>
      </div>
      <div class="unit">
        <span class="num" id="hours">00</span>
        <span class="label">Jam</span>
      </div>
      <div class="unit">
        <span class="num" id="minutes">00</span>
        <span class="label">Menit</span>
      </div>
      <div class="unit">
        <span class="num" id="seconds">00</span>
        <span class="label">Detik</span>
      </div>
    </div>

    <p class="target-date">Menuju <strong>15 April 2027</strong></p>

    <p class="sr-fallback" id="srAnnounce" aria-live="polite"></p>
  </div>

  <div class="celebrate" id="celebrate">
    <svg class="cap-big" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M12 3 2 8l10 5 10-5-10-5Z" stroke-linejoin="round"/><path d="M6 10.5V16c0 1.5 2.7 3 6 3s6-1.5 6-3v-5.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M22 8v6" stroke-linecap="round"/></svg>
    <p>Selamat, harimu telah tiba.</p>
    <p class="subtitle" style="margin-top:6px;">Selamat Wisuda 2027 🎓</p>
  </div>

  <noscript>
    <p class="fallback-visible">Hitung mundur menuju <strong>15 April 2027</strong>. Aktifkan JavaScript untuk melihat hitung mundur langsung.</p>
  </noscript>
</main>

<script>
(function () {
  var target = new Date('2027-04-15T00:00:00+07:00').getTime();

  var els = {
    days: document.getElementById('days'),
    hours: document.getElementById('hours'),
    minutes: document.getElementById('minutes'),
    seconds: document.getElementById('seconds')
  };
  var block = document.getElementById('countdownBlock');
  var celebrate = document.getElementById('celebrate');
  var srAnnounce = document.getElementById('srAnnounce');
  var lastDay = null;
  var timer = null;

  function pad(n) { return String(n).padStart(2, '0'); }

  function render() {
    var now = Date.now();
    var diff = target - now;

    if (diff <= 0) {
      clearInterval(timer);
      block.style.display = 'none';
      celebrate.classList.add('show');
      srAnnounce.textContent = 'Hari wisuda telah tiba.';
      return;
    }

    var d = Math.floor(diff / (1000 * 60 * 60 * 24));
    var h = Math.floor((diff / (1000 * 60 * 60)) % 24);
    var m = Math.floor((diff / (1000 * 60)) % 60);
    var s = Math.floor((diff / 1000) % 60);

    setVal(els.days, pad(d));
    setVal(els.hours, pad(h));
    setVal(els.minutes, pad(m));
    setVal(els.seconds, pad(s));

    if (d !== lastDay) {
      lastDay = d;
      srAnnounce.textContent = d + ' hari lagi menuju Wisuda 2027.';
    }
  }

  function setVal(el, val) {
    if (el.textContent !== val) {
      el.textContent = val;
      el.classList.remove('tick');
      void el.offsetWidth;
      el.classList.add('tick');
    }
  }

  render();
  timer = setInterval(render, 1000);

  var container = document.getElementById('sparkles');
  var prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!prefersReduced) {
    for (var i = 0; i < 10; i++) {
      var dot = document.createElement('div');
      dot.className = 'sparkle';
      var size = 2 + Math.random() * 3;
      dot.style.width = size + 'px';
      dot.style.height = size + 'px';
      dot.style.left = Math.random() * 100 + 'vw';
      dot.style.top = 40 + Math.random() * 55 + 'vh';
      dot.style.animationDelay = (Math.random() * 14) + 's';
      dot.style.animationDuration = (11 + Math.random() * 8) + 's';
      container.appendChild(dot);
    }
  }
})();
</script>

</body>
</html>
